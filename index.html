<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Task Manager</h1>

        <!-- Add Task Form -->
        <div class="form-section">
            <h2>Add New Task</h2>
            <input id="title" placeholder="Task Title" />
            <textarea id="description" placeholder="Task Description"></textarea>
            <button id="addBtn" title="Add a new task">➕ Add Task</button>
        </div>

        <!-- Search & Filter -->
        <div class="filter-section">
            <input id="search" placeholder="🔍 Search tasks..." />
            <select id="filter">
                <option value="all">All Tasks</option>
                <option value="completed">✅ Completed</option>
                <option value="pending">❌ Pending</option>
            </select>
        </div>

        <!-- Task Table -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="taskTable"></tbody>
        </table>
    </div>

    <!-- Edit Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>✏️ Edit Task</h3>
            <input id="editTitle" placeholder="Edit title" />
            <textarea id="editDesc" placeholder="Edit description"></textarea>
            <div class="modal-buttons">
                <button id="saveEdit" title="Save changes">💾 Save</button>
                <button onclick="closeModal()" title="Cancel editing">✖ Cancel</button>
            </div>
        </div>
    </div>

    <script src="public/app.js"></script>
</body>

</html>
